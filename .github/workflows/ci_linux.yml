name: Linux CI Tests

on: 
  push:
    branches:
      - main
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Configure
      run: sudo .github/scripts/install_software.sh
    - name: Build
      run: .github/scripts/build_repo.sh
